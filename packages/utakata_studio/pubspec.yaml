name: utakata_studio
description: "utakata architecture studio — visual architecture editor"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  utakata:
    path: ../utakata_code
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # デスクトップウィンドウ制御
  window_manager: ^0.5.1

  # YAML パーサー
  yaml: ^3.1.3

  # ユーティリティ
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  logger: ^2.6.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
