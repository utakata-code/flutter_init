name: utakata_studio
description: "utakata architecture studio — visual architecture viewer & low-code tool"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  utakata:
    path: ../utakata_code
  flutter:
    sdk: flutter

  # 状態管理
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # データモデル
  freezed_annotation: ^3.0.0

  # デスクトップウィンドウ制御
  window_manager: ^0.5.1

  # YAML パーサー
  yaml: ^3.1.3

  # ユーティリティ
  path: ^1.9.1
  shared_preferences: ^2.5.5
  logger: ^2.6.2
  flutter_riverpod: ^2.6.1
  file_picker: ^11.0.2

  # ルーティング
  go_router: ^15.1.3
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6

flutter:
  uses-material-design: true
