# feature_request.yaml
# utakata plan に渡すと AI/specs/plan_architecture.yaml が生成される
#
# 使い方:
#   1. このファイルにフィーチャー情報を記載する
#   2. utakata plan を実行する
#   3. plan_architecture.yaml が自動生成される
#   4. utakata feature init で一括生成する

# ── プロジェクト情報 ──
project:
  name: "utakata_studio"
  version: "0.1.0"

# ── フィーチャー一覧（Map形式: キー = フィーチャー名） ──
features:
  arch_viewer:
    permission: direct
    entity: arch_definition
    description: "アーキテクチャ定義のビジュアルビューア + サイドバー。3ペイン構成のメイン画面を提供する"

  validation:
    permission: direct
    entity: validation_result
    description: "YAML パース・バリデーション + ファイル変更検知。外部エディタでの変更を自動検知してリアルタイム再検証する"

  layer_visualizer:
    permission: direct
    entity: layer_visual
    description: "レイヤー構造をグラデーションカードで階層的にグラフィカル描画するビジュアライザ"

  settings:
    permission: direct
    entity: app_settings
    description: "utakata CLI パスのオーバーライド等のアプリ設定管理"

# ── Core層の追加設定 ──
core:
  theme:
    files:
      - studio_theme
  config:
    files:
      - app_config
