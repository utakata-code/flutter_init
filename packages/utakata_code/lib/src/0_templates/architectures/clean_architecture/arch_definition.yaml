# アーキテクチャ定義: Clean Architecture (4-layer)
#
# utakata の check / apply / feature add / imports が使う機械可読定義。
# ここには「構造」だけを書く:
#   - 層とディレクトリ(layers)・命名規則(naming_rules)・コア(core_modules)
#   - 層間依存グラフと細則(import_rules)
#   - 層ごとの要点(guides の do/dont — オフライン時の要約用)
#
# 構造以外は別の場所が正:
#   - 外部依存(バージョン + 使ってよい層)→ dependencies/*.yaml
#   - 読み物(解説・コード例)→ layers/**/GUIDE.md, principles/
#
# guides の apply_to / detail_content_path / naming_pattern / title は
# 規約から導出されるため書かない(必要な場合のみ明示で上書き可能):
#   apply_to            = lib/features/**/<layer_path>/**
#   detail_content_path = layers/features/<layer_path>/GUIDE.md
#   naming_pattern      = naming_rules の該当 description

id: clean_architecture
displayName: "Clean Architecture (4-layer)"
# 違反時に CLI が案内するガイドのパス
guides_path: "principles"

# コアモジュールの追跡定義 (動的生成用)
core_modules:
  - id: routing
    path: "lib/core/routing"
    displayName: "routing/"
  - id: routing_path
    path: "lib/core/routing/path"
    displayName: "routing/path/"
  - id: theme
    path: "lib/core/theme"
    displayName: "theme/"
  - id: api
    path: "lib/core/api"
    displayName: "api/"
  - id: env
    path: "lib/core/env"
    displayName: "env/"
  - id: database
    path: "lib/core/database"
    displayName: "database/"
  - id: database_table
    path: "lib/core/database/table"
    displayName: "database/table/"
  - id: exceptions
    path: "lib/core/exceptions"
    displayName: "exceptions/"

layers:
  - name: 1_domain
    dirs:
      - 1_entities
      - 2_repositories
      - 3_usecases
      - exceptions

  - name: 2_infrastructure
    dirs:
      - 1_models
      - 2_data_sources/1_local
      - 2_data_sources/1_local/exceptions
      - 2_data_sources/2_remote
      - 2_data_sources/2_remote/exceptions
      - 3_repositories

  - name: 3_application
    dirs:
      - 1_states
      - 2_providers
      - 3_notifiers

  - name: 4_presentation
    dirs:
      - 1_widgets/1_atoms
      - 1_widgets/2_molecules
      - 1_widgets/3_organisms
      - 2_pages

# 命名規則定義
# dir_pattern : features/{perm}/{name}/ 以下のパスに対する部分一致
# file_pattern: ファイル名に適用する正規表現（.dart のみ対象）
# description : エラー時に表示するパターン説明
naming_rules:
  - dir_pattern: "1_domain/1_entities"
    file_pattern: "^.+_entity\\.dart$"
    description: "{name}_entity.dart"

  - dir_pattern: "1_domain/2_repositories"
    file_pattern: "^.+_repository\\.dart$"
    description: "{name}_repository.dart"

  - dir_pattern: "1_domain/3_usecases"
    file_pattern: "^.+_usecase\\.dart$"
    description: "{verb}_{name}_usecase.dart"

  - dir_pattern: "1_domain/exceptions"
    file_pattern: "^.+_exceptions?\\.dart$|^domain_exceptions\\.dart$"
    description: "{name}_exceptions.dart or domain_exceptions.dart"

  - dir_pattern: "2_infrastructure/1_models"
    file_pattern: "^.+_model\\.dart$"
    description: "{name}_model.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/1_local/exceptions"
    file_pattern: "^.+_local_exceptions?\\.dart$"
    description: "{name}_local_exceptions.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/1_local"
    file_pattern: "^.+_data_source\\.dart$"
    description: "{name}_data_source.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/2_remote/exceptions"
    file_pattern: "^.+_remote_exceptions?\\.dart$"
    description: "{name}_remote_exceptions.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/2_remote"
    file_pattern: "^.+_remote_data_source\\.dart$"
    description: "{name}_remote_data_source.dart"

  - dir_pattern: "2_infrastructure/3_repositories"
    file_pattern: "^.+_repository_impl\\.dart$"
    description: "{name}_repository_impl.dart"

  - dir_pattern: "3_application/1_states"
    file_pattern: "^.+_state\\.dart$"
    description: "{feature}_state.dart"

  - dir_pattern: "3_application/2_providers"
    file_pattern: "^.+_providers?\\.dart$"
    description: "{feature}_providers.dart"

  - dir_pattern: "3_application/3_notifiers"
    file_pattern: "^.+_notifier\\.dart$"
    description: "{feature}_notifier.dart"

  - dir_pattern: "4_presentation/1_widgets/1_atoms"
    file_pattern: "^.+_atom\\.dart$"
    description: "{name}_atom.dart"

  - dir_pattern: "4_presentation/1_widgets/2_molecules"
    file_pattern: "^.+_molecule\\.dart$"
    description: "{name}_molecule.dart"

  - dir_pattern: "4_presentation/1_widgets/3_organisms"
    file_pattern: "^.+_organism\\.dart$"
    description: "{name}_organism.dart"

  - dir_pattern: "4_presentation/2_pages"
    file_pattern: "^.+_page\\.dart$"
    description: "{feature}_page.dart"

# ─── import 監査規則 (`utakata imports` が使用) ───
# layers: 層間依存グラフ。「この層はこの層たちを見てよい」の一意な宣言
#         (許可の上限であって強制ではない。自層は常に許可)。
# dirs  : 層既定より絞りたいディレクトリだけ上書きする細則(最長一致が正)。
# 層に属さないパス(core/、main.dart 等)は監査対象外(composition root の逃げ道)。
# 外部パッケージの制約はここではなく dependencies/*.yaml の layers:(配置宣言)。
import_rules:
  exclude:
    - "**.g.dart"
    - "**.freezed.dart"

  layers:
    1_domain: []                                      # 何にも依存しない
    2_infrastructure: [1_domain]
    3_application: [1_domain, 2_infrastructure]       # infra は providers(DI) が束ねる
    4_presentation: [1_domain, 3_application]

  dirs:
    # ドメイン層内の細則
    - dir_pattern: "1_domain/1_entities"
      allow: ["1_domain/exceptions"]
    - dir_pattern: "1_domain/exceptions"
      allow: ["1_domain/1_entities"]
    # データソースはモデルの受け渡しのみ(エンティティを直接扱わない)
    - dir_pattern: "2_infrastructure/2_data_sources/1_local"
      allow: ["2_infrastructure/1_models"]
    - dir_pattern: "2_infrastructure/2_data_sources/1_local/exceptions"
      allow: ["2_infrastructure/1_models"]
    - dir_pattern: "2_infrastructure/2_data_sources/2_remote"
      allow: ["2_infrastructure/1_models"]
    - dir_pattern: "2_infrastructure/2_data_sources/2_remote/exceptions"
      allow: ["2_infrastructure/1_models"]
    # 状態クラスは純粋(エンティティ以外を見ない)
    - dir_pattern: "3_application/1_states"
      allow: ["1_domain/1_entities"]
    # notifier はインフラへ行かない(DI は providers 経由)
    - dir_pattern: "3_application/3_notifiers"
      allow: ["1_domain", "3_application"]
    # UI 部品は小さいほど依存が少ない(atoms → molecules → organisms)
    - dir_pattern: "4_presentation/1_widgets/1_atoms"
      allow: []
    - dir_pattern: "4_presentation/1_widgets/2_molecules"
      allow: ["1_domain/1_entities", "4_presentation/1_widgets/1_atoms"]
    - dir_pattern: "4_presentation/1_widgets/3_organisms"
      allow: ["1_domain/1_entities", "4_presentation/1_widgets"]

# 層ごとの要点(オフライン時の guide show 用の要約。本文は layers/**/GUIDE.md)
guides:
  - layer_path: "1_domain/1_entities"
    title: "Entity Layer - エンティティ層"
    do:
      - "ビジネスオブジェクトの定義とビジネスルールの実装(不変性を保証)"
      - "純粋な Dart コード(外部ライブラリに依存しない)"
    dont:
      - "UI・状態管理・DB・HTTP など外部への依存"

  - layer_path: "1_domain/2_repositories"
    title: "Repository Interface Layer - リポジトリインターフェース層"
    do:
      - "データアクセスの抽象化(abstract interface class)とドメイン境界の保護"
    dont:
      - "具象実装・DB/通信/状態管理ライブラリへの依存"

  - layer_path: "1_domain/3_usecases"
    title: "UseCase Layer - ユースケース層"
    do:
      - "ビジネスユースケースの表現(リポジトリ・サービスの協調)"
    dont:
      - "外部 API の直接呼び出し・UI 状態の管理"

  - layer_path: "1_domain/exceptions"
    title: "Domain Exceptions Layer - ドメイン例外層"
    do:
      - "ドメイン固有エラーの定義(例: UserNotFoundException)"
    dont:
      - "インフラ層エラー(HTTP 404 / SQL 違反)の漏洩"

  - layer_path: "2_infrastructure/1_models"
    title: "Data Model Layer - データモデル層"
    do:
      - "外部データとエンティティの相互変換・シリアライズ(fromJson/toJson)"
    dont:
      - "ビジネスロジックの混入(計算・整合性チェックはエンティティへ)"

  - layer_path: "2_infrastructure/2_data_sources/1_local"
    title: "Local Data Source Layer - ローカルデータソース層"
    do:
      - "ローカル永続化(SQLite / SharedPreferences 等)への生アクセス"
    dont:
      - "ドメインエンティティの直接返却(変換はリポジトリ実装で行う)"

  - layer_path: "2_infrastructure/2_data_sources/1_local/exceptions"
    title: "Local Data Source Exceptions Layer - ローカルデータソース例外層"
    do:
      - "ローカルデータソース固有エラーの定義(SQL 失敗・キャッシュ消失等)"
    dont:
      - "ドメイン層への直接伝播(リポジトリ実装でドメイン例外へ翻訳)"

  - layer_path: "2_infrastructure/2_data_sources/2_remote"
    title: "Remote Data Source Layer - リモートデータソース層"
    do:
      - "外部 API(REST / GraphQL 等)との生の通信処理"
    dont:
      - "ビジネス要件に基づく永続化キャッシュの実装"

  - layer_path: "2_infrastructure/2_data_sources/2_remote/exceptions"
    title: "Remote Data Source Exceptions Layer - リモートデータソース例外層"
    do:
      - "リモートデータソース固有エラーの定義(タイムアウト・5xx 等)"
    dont:
      - "UI 層での直接ハンドリング(リポジトリ経由でドメイン境界へ翻訳)"

  - layer_path: "2_infrastructure/3_repositories"
    title: "Repository Implementation Layer - リポジトリ実装層"
    do:
      - "ドメインのリポジトリ I/F の具象化・データソースの調整・例外の翻訳"
    dont:
      - "ドメインルールの追加実装(ビジネスロジック厳禁)"

  - layer_path: "3_application/1_states"
    title: "Application State Layer - アプリケーション状態層"
    do:
      - "UI 状態(ローディング/成功/失敗)の不変オブジェクト定義(@freezed)"
    dont:
      - "ミュータブルな状態表現"

  - layer_path: "3_application/2_providers"
    title: "Application Providers Layer - プロバイダ定義層"
    do:
      - "DI 定義(composition root): ユースケース・リポジトリ等の注入設定"
    dont:
      - "ウィジェット内部での DI ロジック記述(DI はこの層に集約)"

  - layer_path: "3_application/3_notifiers"
    title: "Application Notifiers Layer - ノティファイア層"
    do:
      - "ユーザーイベントを受け、ユースケースを呼び出して状態を更新"
    dont:
      - "ビジネスルールの直接記述(ユースケース・エンティティへ委譲)"

  - layer_path: "4_presentation/1_widgets/1_atoms"
    title: "Presentation Atoms Layer - アトム UI 部品層"
    do:
      - "これ以上分割できない末端 UI 部品(テキスト・ボタン等)の定義"
    dont:
      - "状態管理・他レイヤーへの依存(データは引数で受け取る)"

  - layer_path: "4_presentation/1_widgets/2_molecules"
    title: "Presentation Molecules Layer - モレキュール UI 部品層"
    do:
      - "アトムを組み合わせた中型 UI 部品(例: 検索バー・カード)"
    dont:
      - "状態管理への依存(パラメータは引数で受け取る)"

  - layer_path: "4_presentation/1_widgets/3_organisms"
    title: "Presentation Organisms Layer - オーガニズム UI 部品層"
    do:
      - "ドメインコンテキストを持つ大型 UI 部品(エンティティを引数で受け取り可)"
    dont:
      - "直接の HTTP 通信・API コール(データはノティファイアから)"

  - layer_path: "4_presentation/2_pages"
    title: "Presentation Pages Layer - 画面・ページ層"
    do:
      - "画面レイアウトの構築とノティファイアの watch・イベント通知"
    dont:
      - "画面遷移以外のビジネスロジック記述"
