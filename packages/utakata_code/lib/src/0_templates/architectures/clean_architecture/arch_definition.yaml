# アーキテクチャ定義: Clean Architecture (4-layer)
#
# この定義ファイルが utakata feature add / feature init が生成する
# ディレクトリ構造と命名規則を決定する。
# utakata apply / feature add が生成するディレクトリ構造の正である。
#
# 新しいアーキテクチャを追加する際は、
# templates/architectures/{arch_id}/arch_definition.yaml を追加するだけでよい。

id: clean_architecture
displayName: "Clean Architecture (4-layer)"
# プロジェクト内の対応ガイドへのパス（utakata check が違反時に案内する）
guides_path: "principles"

# コアモジュールの追跡定義 (動的生成用)
core_modules:
  - id: routing
    path: "lib/core/routing"
    displayName: "routing/"
  - id: routing_path
    path: "lib/core/routing/path"
    displayName: "routing/path/"
  - id: theme
    path: "lib/core/theme"
    displayName: "theme/"
  - id: api
    path: "lib/core/api"
    displayName: "api/"
  - id: env
    path: "lib/core/env"
    displayName: "env/"
  - id: database
    path: "lib/core/database"
    displayName: "database/"
  - id: database_table
    path: "lib/core/database/table"
    displayName: "database/table/"
  - id: exceptions
    path: "lib/core/exceptions"
    displayName: "exceptions/"

# 推奨される依存関係
dependencies:
  flutter:
    sdk: flutter

  # ─── Firebase ───
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0

  # ─── 認証 ───
  google_sign_in: ^7.2.0

  # ─── 状態管理 ───
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # ─── データモデル ───
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ─── 画面遷移 ───
  go_router: ^15.1.3

  # ─── ローカルDB（riverpod_generator互換のためv2.27.0に固定） ───
  drift: ^2.27.0
  sqlite3_flutter_libs: ^0.5.41

  # ─── Google API 連携（Sheets / Drive） ───
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0

  # ─── UI ───
  fl_chart: ^1.2.0
  pdfrx: ^1.0.98

  # ─── ユーティリティ ───
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  logger: ^2.6.2
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # ─── デスクトップ専用 ───
  window_manager: ^0.5.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ─── コード生成 ───
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  drift_dev: ^2.27.0


layers:
  - name: 1_domain
    dirs:
      - 1_entities
      - 2_repositories
      - 3_usecases
      - exceptions

  - name: 2_infrastructure
    dirs:
      - 1_models
      - 2_data_sources/1_local
      - 2_data_sources/1_local/exceptions
      - 2_data_sources/2_remote
      - 2_data_sources/2_remote/exceptions
      - 3_repositories

  - name: 3_application
    dirs:
      - 1_states
      - 2_providers
      - 3_notifiers

  - name: 4_presentation
    dirs:
      - 1_widgets/1_atoms
      - 1_widgets/2_molecules
      - 1_widgets/3_organisms
      - 2_pages

# 命名規則定義
# dir_pattern : features/{perm}/{name}/ 以下のパスに対する部分一致
# file_pattern: ファイル名に適用する正規表現（.dart のみ対象）
# description : エラー時に表示するパターン説明
naming_rules:
  - dir_pattern: "1_domain/1_entities"
    file_pattern: "^.+_entity\\.dart$"
    description: "{name}_entity.dart"

  - dir_pattern: "1_domain/2_repositories"
    file_pattern: "^.+_repository\\.dart$"
    description: "{name}_repository.dart"

  - dir_pattern: "1_domain/3_usecases"
    file_pattern: "^.+_usecase\\.dart$"
    description: "{verb}_{name}_usecase.dart"

  - dir_pattern: "1_domain/exceptions"
    file_pattern: "^.+_exceptions?\\.dart$|^domain_exceptions\\.dart$"
    description: "{name}_exceptions.dart or domain_exceptions.dart"

  - dir_pattern: "2_infrastructure/1_models"
    file_pattern: "^.+_model\\.dart$"
    description: "{name}_model.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/1_local/exceptions"
    file_pattern: "^.+_local_exceptions?\\.dart$"
    description: "{name}_local_exceptions.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/1_local"
    file_pattern: "^.+_data_source\\.dart$"
    description: "{name}_data_source.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/2_remote/exceptions"
    file_pattern: "^.+_remote_exceptions?\\.dart$"
    description: "{name}_remote_exceptions.dart"

  - dir_pattern: "2_infrastructure/2_data_sources/2_remote"
    file_pattern: "^.+_remote_data_source\\.dart$"
    description: "{name}_remote_data_source.dart"

  - dir_pattern: "2_infrastructure/3_repositories"
    file_pattern: "^.+_repository_impl\\.dart$"
    description: "{name}_repository_impl.dart"

  - dir_pattern: "3_application/1_states"
    file_pattern: "^.+_state\\.dart$"
    description: "{feature}_state.dart"

  - dir_pattern: "3_application/2_providers"
    file_pattern: "^.+_providers?\\.dart$"
    description: "{feature}_providers.dart"

  - dir_pattern: "3_application/3_notifiers"
    file_pattern: "^.+_notifier\\.dart$"
    description: "{feature}_notifier.dart"

  - dir_pattern: "4_presentation/1_widgets/1_atoms"
    file_pattern: "^.+_atom\\.dart$"
    description: "{name}_atom.dart"

  - dir_pattern: "4_presentation/1_widgets/2_molecules"
    file_pattern: "^.+_molecule\\.dart$"
    description: "{name}_molecule.dart"

  - dir_pattern: "4_presentation/1_widgets/3_organisms"
    file_pattern: "^.+_organism\\.dart$"
    description: "{name}_organism.dart"

  - dir_pattern: "4_presentation/2_pages"
    file_pattern: "^.+_page\\.dart$"
    description: "{feature}_page.dart"

guides:
  - title: "Entity Layer Instructions - エンティティ層"
    layer_path: "1_domain/1_entities"
    apply_to: "lib/features/**/1_domain/1_entities/**"
    naming_pattern: "{対象名}_entity.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/1_domain/1_entities/GUIDE.md"
    do_list:
      - "ビジネスオブジェクトの定義: アプリケーションで扱う中核的なデータ構造"
      - "ビジネスルールの実装: ドメイン固有のバリデーションやビジネスロジック"
      - "不変性の保証: オブジェクトの整合性を維持"
      - "純粋なDartコード: 外部ライブラリに依存しない実装"
    dont_list:
      - "UIフレームワークへの依存: Flutterウィジェットのimport禁止"
      - "データベースアクセス: 永続化に関する処理の記述"
      - "HTTP通信: 外部APIへのアクセス処理"
      - "状態管理ライブラリへの依存: Riverpodなどのimport禁止"
    allowed_imports:
      - "import 'dart:core';"
      - "import 'package:freezed_annotation/freezed_annotation.dart';"
      - "import 'package:json_annotation/json_annotation.dart';"
      - "import '../other_entity.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:riverpod/riverpod.dart';"
      - "import 'package:dio/dio.dart';"
      - "import 'package:drift/drift.dart';"
      - "import '../../infrastructure/models/user_model.dart';"

  - title: "Repository Interface Layer - リポジトリインターフェース層"
    layer_path: "1_domain/2_repositories"
    apply_to: "lib/features/**/1_domain/2_repositories/**"
    naming_pattern: "{対象名}_repository.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/1_domain/2_repositories/GUIDE.md"
    do_list:
      - "データアクセスの抽象化: データの永続化や取得に関するインターフェースの定義"
      - "ドメイン境界の保護: 外部のデータソース仕様がドメインモデルに影響しないように隠蔽"
      - "関心の分離: Domain層は「何をするか」のみを定義し、「どうやるか」はInfrastructure層に委譲"
    dont_list:
      - "具象クラスの実装: classでの定義は禁止（abstract interface classを使用）"
      - "データベース・通信ライブラリへの依存: driftやdioなどの直接のimport"
      - "状態管理ライブラリへの依存: Riverpodなどの直接のimport"
    allowed_imports:
      - "import '../1_entities/some_entity.dart';"
      - "import '../exceptions/some_exceptions.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:drift/drift.dart';"
      - "import 'package:dio/dio.dart';"
      - "import '../../infrastructure/models/some_model.dart';"

  - title: "UseCase Layer - ユースケース層"
    layer_path: "1_domain/3_usecases"
    apply_to: "lib/features/**/1_domain/3_usecases/**"
    naming_pattern: "{動詞}_{対象名}_usecase.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/1_domain/3_usecases/GUIDE.md"
    do_list:
      - "ビジネスユースケースの表現: ユーザーアクションに対するアプリケーション独自のビジネスロジックを実装"
      - "リポジトリ・サービスの協調: 複数のリポジトリインターフェースを組み合わせて処理を調整"
      - "ドメインイベントの発行: 必要に応じたイベント通知やトランザクション境界の定義"
    dont_list:
      - "外部APIの直接呼び出し: 具体的なHTTP通信やクエリロジックを直接記述しない"
      - "UI表示状態の管理: ウィジェットツリーと直結する状態管理ロジックの排除"
    allowed_imports:
      - "import '../1_entities/some_entity.dart';"
      - "import '../2_repositories/some_repository.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:riverpod/riverpod.dart';"
      - "import '../../infrastructure/repositories/some_repository_impl.dart';"

  - title: "Domain Exceptions Layer - ドメイン例外層"
    layer_path: "1_domain/exceptions"
    apply_to: "lib/features/**/1_domain/exceptions/**"
    naming_pattern: "{対象名}_exceptions.dart または domain_exceptions.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/1_domain/exceptions/GUIDE.md"
    do_list:
      - "ドメイン固有エラーの定義: ビジネスロジックで発生する特定の異常系（例: UserNotFoundException）"
      - "不変かつ明確な構造: 例外の発生理由やユーザー向けのメッセージをカプセル化"
    dont_list:
      - "インフラ層エラーの漏洩: HTTP 404やSQL違反エラーをそのままドメイン例外としてスローしない"
    allowed_imports:
      - "import 'dart:core';"
    forbidden_imports:
      - "import 'package:dio/dio.dart';"

  - title: "Data Model Layer - データモデル層"
    layer_path: "2_infrastructure/1_models"
    apply_to: "lib/features/**/2_infrastructure/1_models/**"
    naming_pattern: "{対象名}_model.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/2_infrastructure/1_models/GUIDE.md"
    do_list:
      - "外部データのマッピング: JSONやDBレコードと、ドメインエンティティの相互変換を担当"
      - "シリアライズ処理: fromJson / toJson 等のシリアライザ定義"
    dont_list:
      - "ビジネスロジックの混入: 計算処理や整合性チェックはエンティティ側に記述する"
    allowed_imports:
      - "import 'package:freezed_annotation/freezed_annotation.dart';"
      - "import '../../../1_domain/1_entities/some_entity.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import '../../../1_domain/3_usecases/some_usecase.dart';"

  - title: "Local Data Source Layer - ローカルデータソース層"
    layer_path: "2_infrastructure/2_data_sources/1_local"
    apply_to: "lib/features/**/2_infrastructure/2_data_sources/1_local/**"
    naming_pattern: "{対象名}_local_data_source.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/2_infrastructure/2_data_sources/1_local/GUIDE.md"
    do_list:
      - "ローカル永続化アクセス: SQLite, SharedPreferences などのローカルストレージからの生データ取得・保存"
    dont_list:
      - "ドメインエンティティの直接返却: 生データまたはインフラ用モデルを返し、エンティティの変換はリポジトリ実装で行う"
    allowed_imports:
      - "import '../../1_models/some_model.dart';"
      - "import 'package:drift/drift.dart';"
    forbidden_imports:
      - "import '../../../1_domain/1_entities/some_entity.dart';"
      - "import 'package:dio/dio.dart';"

  - title: "Local Data Source Exceptions Layer - ローカルデータソース例外層"
    layer_path: "2_infrastructure/2_data_sources/1_local/exceptions"
    apply_to: "lib/features/**/2_infrastructure/2_data_sources/1_local/exceptions/**"
    naming_pattern: "{対象名}_local_exceptions.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/2_infrastructure/2_data_sources/1_local/exceptions/GUIDE.md"
    do_list:
      - "ローカルデータソース固有エラーの定義: SQLクエリ失敗やキャッシュ消失エラーなど"
    dont_list:
      - "ドメイン層への直接伝播: リポジトリ層で適切にキャッチ・ドメイン例外に変換すること"
    allowed_imports:
      - "import 'dart:core';"
    forbidden_imports:
      - "import '../../../1_domain/1_entities/some_entity.dart';"

  - title: "Remote Data Source Layer - リモートデータソース層"
    layer_path: "2_infrastructure/2_data_sources/2_remote"
    apply_to: "lib/features/**/2_infrastructure/2_data_sources/2_remote/**"
    naming_pattern: "{対象名}_remote_data_source.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/2_infrastructure/2_data_sources/2_remote/GUIDE.md"
    do_list:
      - "外部API通信: REST API, GraphQL などのリモートサーバーとの生の通信処理"
    dont_list:
      - "キャッシュ制御の記述: HTTPキャッシュ以外のビジネス要件に基づく永続化キャッシュはここに書かない"
    allowed_imports:
      - "import '../../1_models/some_model.dart';"
      - "import 'package:dio/dio.dart';"
    forbidden_imports:
      - "import '../../../1_domain/1_entities/some_entity.dart';"
      - "import 'package:drift/drift.dart';"

  - title: "Remote Data Source Exceptions Layer - リモートデータソース例外層"
    layer_path: "2_infrastructure/2_data_sources/2_remote/exceptions"
    apply_to: "lib/features/**/2_infrastructure/2_data_sources/2_remote/exceptions/**"
    naming_pattern: "{対象名}_remote_exceptions.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/2_infrastructure/2_data_sources/2_remote/exceptions/GUIDE.md"
    do_list:
      - "リモートデータソース固有エラーの定義: APIタイムアウト、500内部サーバーエラーなど"
    dont_list:
      - "UI層での直接ハンドリング: リポジトリ層を通じて例外をドメイン境界に翻訳する"
    allowed_imports:
      - "import 'dart:core';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"

  - title: "Repository Implementation Layer - リポジトリ実装層"
    layer_path: "2_infrastructure/3_repositories"
    apply_to: "lib/features/**/2_infrastructure/3_repositories/**"
    naming_pattern: "{対象名}_repository_impl.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/2_infrastructure/3_repositories/GUIDE.md"
    do_list:
      - "抽象インターフェースの実装: Domain層のRepositoryインターフェースを具象化"
      - "データソースの調整: ローカルとリモートのデータソースを適切に使い分ける"
      - "例外の翻訳: インフラ層で発生した固有の例外をドメイン例外へ翻訳する"
    dont_list:
      - "ドメインルールの追加実装: ビジネスロジックをここに書くことは厳禁"
    allowed_imports:
      - "import '../../../1_domain/1_entities/some_entity.dart';"
      - "import '../../../1_domain/2_repositories/some_repository.dart';"
      - "import '../../1_models/some_model.dart';"
      - "import '../../2_data_sources/1_local/some_local_data_source.dart';"
      - "import '../../2_data_sources/2_remote/some_remote_data_source.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:riverpod/riverpod.dart';"

  - title: "Application State Layer - アプリケーション状態層"
    layer_path: "3_application/1_states"
    apply_to: "lib/features/**/3_application/1_states/**"
    naming_pattern: "{対象名}_state.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/3_application/1_states/GUIDE.md"
    do_list:
      - "UI状態の定義: ローディング、成功、失敗など、プレゼンテーション層が描画するための不変状態オブジェクト"
    dont_list:
      - "ミュータブルな状態表現: 状態クラスは原則として @freezed を用いイミュータブルに定義する"
    allowed_imports:
      - "import 'package:freezed_annotation/freezed_annotation.dart';"
      - "import '../../../1_domain/1_entities/some_entity.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:riverpod/riverpod.dart';"

  - title: "Application Providers Layer - プロバイダ定義層"
    layer_path: "3_application/2_providers"
    apply_to: "lib/features/**/3_application/2_providers/**"
    naming_pattern: "{対象名}_providers.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/3_application/2_providers/GUIDE.md"
    do_list:
      - "DI定義: ユースケース、リポジトリ、コントローラーなどの依存注入設定を Riverpod の Provider を用いて定義"
    dont_list:
      - "ウィジェット内部でのDIロジック記述: DI は一箇所（このレイヤー）にまとめる"
    allowed_imports:
      - "import 'package:riverpod_annotation/riverpod_annotation.dart';"
      - "import '../../../1_domain/3_usecases/some_usecase.dart';"
      - "import '../../../2_infrastructure/3_repositories/some_repository_impl.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"

  - title: "Application Notifiers Layer - ノティファイア層"
    layer_path: "3_application/3_notifiers"
    apply_to: "lib/features/**/3_application/3_notifiers/**"
    naming_pattern: "{対象名}_notifier.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/3_application/3_notifiers/GUIDE.md"
    do_list:
      - "UI状態変更ロジックの管理: ユーザーイベントを受け取り、ユースケースを呼び出して状態 (State) を更新する"
    dont_list:
      - "ビジネスルールの直接記述: 実際の業務要件ロジックはドメインユースケースやエンティティに委譲すること"
    allowed_imports:
      - "import 'package:riverpod_annotation/riverpod_annotation.dart';"
      - "import '../1_states/some_state.dart';"
      - "import '../../../1_domain/3_usecases/some_usecase.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import '../../../2_infrastructure/3_repositories/some_repository_impl.dart';"

  - title: "Presentation Atoms Layer - アトム UI 部品層"
    layer_path: "4_presentation/1_widgets/1_atoms"
    apply_to: "lib/features/**/4_presentation/1_widgets/1_atoms/**"
    naming_pattern: "{対象名}_atom.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/4_presentation/1_widgets/1_atoms/GUIDE.md"
    do_list:
      - "最小 UI 部品の定義: テキスト、ボタン、アイコンなどのこれ以上分割できない末端 UI コンポーネント"
    dont_list:
      - "アプリケーション状態 (Riverpod) の直接参照: アトムは純粋な UI 描画のみ行い、状態に依存しない（引数で受け取る）"
      - "他レイヤー（Domain, Infrastructure）への依存: ビジネスオブジェクトやAPIに直接依存しない"
    allowed_imports:
      - "import 'package:flutter/material.dart';"
    forbidden_imports:
      - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
      - "import '../../../../1_domain/1_entities/some_entity.dart';"

  - title: "Presentation Molecules Layer - モレキュール UI 部品層"
    layer_path: "4_presentation/1_widgets/2_molecules"
    apply_to: "lib/features/**/4_presentation/1_widgets/2_molecules/**"
    naming_pattern: "{対象名}_molecule.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/4_presentation/1_widgets/2_molecules/GUIDE.md"
    do_list:
      - "UI 部品の組み合わせ: 複数のアトムを組み合わせた、特定のコンテキストを持たない中型 UI コンポーネント（例: 検索バー）"
    dont_list:
      - "アプリケーション状態への依存: 原則として状態管理から隔離され、引数でパラメータを受け取る設計にする"
    allowed_imports:
      - "import 'package:flutter/material.dart';"
      - "import '../1_atoms/some_atom.dart';"
    forbidden_imports:
      - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
      - "import '../../../../1_domain/3_usecases/some_usecase.dart';"

  - title: "Presentation Organisms Layer - オーガニズム UI 部品層"
    layer_path: "4_presentation/1_widgets/3_organisms"
    apply_to: "lib/features/**/4_presentation/1_widgets/3_organisms/**"
    naming_pattern: "{対象名}_organism.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/4_presentation/1_widgets/3_organisms/GUIDE.md"
    do_list:
      - "自己完結する UI ブロックの定義: アトムやモレキュールを組み合わせ、特定のドメインコンテキストを持つ大型 UI コンポーネント（例: ユーザープロフィールカード）"
      - "ドメインエンティティへの依存: レンダリングのためにエンティティ型を引数として受け取ることが可能"
    dont_list:
      - "直接の HTTP 通信や API コール: 表示データはノティファイアから流し込まれるようにする"
    allowed_imports:
      - "import 'package:flutter/material.dart';"
      - "import '../../../../1_domain/1_entities/some_entity.dart';"
      - "import '../1_atoms/some_atom.dart';"
      - "import '../2_molecules/some_molecule.dart';"
    forbidden_imports:
      - "import '../../../../2_infrastructure/3_repositories/some_repository_impl.dart';"

  - title: "Presentation Pages Layer - 画面・ページ層"
    layer_path: "4_presentation/2_pages"
    apply_to: "lib/features/**/4_presentation/2_pages/**"
    naming_pattern: "{対象名}_page.dart"
    detail_content_path: "architectures/clean_architecture/layers/features/4_presentation/2_pages/GUIDE.md"
    do_list:
      - "完全な画面レイアウトの構築: オーガニズムやモレキュールを配置して一つの画面を定義する"
      - "状態の監視とイベントディスパッチ: ConsumerWidget 等を用いてノティファイアの状態を監視（watch）し、ユーザーアクションをトリガーする"
    dont_list:
      - "画面遷移以外のビジネスロジック記述: イベントをノティファイアに通知するのみとし、ロジック自体は書かない"
    allowed_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
      - "import '../../../3_application/3_notifiers/some_notifier.dart';"
      - "import '../1_widgets/3_organisms/some_organism.dart';"
    forbidden_imports:
      - "import '../../../../2_infrastructure/3_repositories/some_repository_impl.dart';"

# ─── import 監査規則 (`utakata imports` が使用) ───
# guides の allowed_imports / forbidden_imports(人間向けの例示)を
# 機械可読に正式化したもの。
#   internal: 各層ディレクトリが import してよい層(ホワイトリスト)。
#             自層は常に許可。層に属さないパス(core/、main.dart 等)への
#             import は監査対象外(composition root の逃げ道)。
#   external: 層ディレクトリごとに import を禁止するパッケージ(ブラックリスト)。
#             パッケージ名は glob 可(例: *riverpod*)。dart:xxx も指定可。
#             同じパスに複数ルールが該当する場合はすべて適用される。
#   exclude : 監査から除外するファイル(コード生成物)。
import_rules:
  exclude:
    - "**.g.dart"
    - "**.freezed.dart"

  internal:
    - dir_pattern: "1_domain/1_entities"
      allow: ["1_domain/exceptions"]
    - dir_pattern: "1_domain/2_repositories"
      allow: ["1_domain/1_entities", "1_domain/exceptions"]
    - dir_pattern: "1_domain/3_usecases"
      allow: ["1_domain/1_entities", "1_domain/2_repositories", "1_domain/exceptions"]
    - dir_pattern: "1_domain/exceptions"
      allow: []
    - dir_pattern: "2_infrastructure/1_models"
      allow: ["1_domain/1_entities", "1_domain/exceptions"]
    - dir_pattern: "2_infrastructure/2_data_sources/1_local"
      allow: ["2_infrastructure/1_models"]
    - dir_pattern: "2_infrastructure/2_data_sources/1_local/exceptions"
      allow: []
    - dir_pattern: "2_infrastructure/2_data_sources/2_remote"
      allow: ["2_infrastructure/1_models"]
    - dir_pattern: "2_infrastructure/2_data_sources/2_remote/exceptions"
      allow: []
    - dir_pattern: "2_infrastructure/3_repositories"
      allow: ["1_domain", "2_infrastructure"]
    - dir_pattern: "3_application/1_states"
      allow: ["1_domain/1_entities"]
    # providers は DI 定義層(composition root)なので広く許可する
    - dir_pattern: "3_application/2_providers"
      allow: ["1_domain", "2_infrastructure", "3_application"]
    - dir_pattern: "3_application/3_notifiers"
      allow: ["1_domain/1_entities", "1_domain/3_usecases", "1_domain/exceptions",
              "3_application/1_states", "3_application/2_providers"]
    - dir_pattern: "4_presentation/1_widgets/1_atoms"
      allow: []
    - dir_pattern: "4_presentation/1_widgets/2_molecules"
      allow: ["4_presentation/1_widgets/1_atoms"]
    - dir_pattern: "4_presentation/1_widgets/3_organisms"
      allow: ["1_domain/1_entities", "4_presentation/1_widgets"]
    - dir_pattern: "4_presentation/2_pages"
      allow: ["1_domain/1_entities", "3_application", "4_presentation"]

  external:
    # ドメイン層は純粋 Dart(UI・状態管理・IO ライブラリを持ち込まない)
    - dir_pattern: "1_domain"
      deny: ["flutter", "flutter_hooks", "*riverpod*", "go_router",
             "dio", "http", "drift", "sqflite", "shared_preferences",
             "firebase_*", "googleapis*"]
    # インフラ層は UI・状態管理に依存しない
    - dir_pattern: "2_infrastructure"
      deny: ["flutter", "flutter_hooks", "*riverpod*", "go_router"]
    - dir_pattern: "2_infrastructure/2_data_sources/1_local"
      deny: ["dio", "http"]
    - dir_pattern: "2_infrastructure/2_data_sources/2_remote"
      deny: ["drift", "sqflite", "shared_preferences"]
    # アプリケーション層は UI(ウィジェット)に依存しない
    - dir_pattern: "3_application"
      deny: ["flutter", "go_router"]
    # 状態クラスは純粋な freezed オブジェクト(riverpod にも依存しない)
    - dir_pattern: "3_application/1_states"
      deny: ["*riverpod*", "flutter_hooks"]
    # プレゼンテーション層は IO を直接行わない
    - dir_pattern: "4_presentation"
      deny: ["dio", "http", "drift", "sqflite"]
    # atoms / molecules は状態管理から隔離する(引数で受け取る)
    - dir_pattern: "4_presentation/1_widgets/1_atoms"
      deny: ["*riverpod*"]
    - dir_pattern: "4_presentation/1_widgets/2_molecules"
      deny: ["*riverpod*"]
