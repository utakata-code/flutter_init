# コアスタック: 外部依存の正(バージョン + 配置宣言)
#
# 1 パッケージにつき「バージョン」と「使ってよい層(layers)」をここで管理する。
#   - `utakata create` がこのファイルから初期 pubspec.yaml を生成する
#   - `utakata imports` が layers(配置宣言)を検証する
#
# layers の意味:
#   - キー省略        → 配置制約なし(どの層でも import 可)
#   - layers: []      → どの層でも import しない(ビルド時のみ必要な依存)
#   - layers: [層パス] → その層でのみ import 可
# ここに宣言の無いパッケージは utakata imports では論じない(すべて許可)。
#
# 書式(旧): `package: ^version` のスカラ形式もそのまま読める(配置制約なし)。

dependencies:
  # ─── Flutter 本体(UI 層のみ) ───
  flutter:
    sdk: flutter
    layers: [4_presentation]

  # ─── 状態管理 ───
  hooks_riverpod:
    version: ^2.6.1
    layers: [3_application, 4_presentation]
  riverpod_annotation:
    version: ^2.4.0
    layers: [3_application]

  # ─── データモデル(全層可: エンティティも使う) ───
  freezed_annotation:
    version: ^3.0.0
  json_annotation:
    version: ^4.9.0

  # ─── 画面遷移 ───
  go_router:
    version: ^15.1.3
    layers: [4_presentation]

  # ─── ローカルDB ───
  drift:
    version: ^2.28.2
    layers: [2_infrastructure/2_data_sources/1_local]
  sqlite3_flutter_libs:
    version: ^0.5.41
    layers: []            # import しない(ビルド時のみ)
  path_provider:
    version: ^2.1.5
    layers: [2_infrastructure]
  path:
    version: ^1.9.1

  # ─── ユーティリティ ───
  logger:
    version: ^2.6.2

dev_dependencies:
  # コード生成(lib/ から import しないため配置宣言は不要)
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ">=2.25.0 <2.28.2"
  riverpod_generator: ^2.6.5

  # 品質管理
  flutter_lints: ^5.0.0
