# feature_request.yaml
# AI書き込み用 — フィーチャーの要件定義のみを記載する
# AI/scripts/generate/generate_plan.sh に渡すと AI/snapshots/plan_architecture.yaml が生成される
#
# 使い方:
#   1. AIがこのファイルにフィーチャー情報を記載する
#   2. ./AI/scripts/generate/generate_plan.sh を実行する
#   3. バリデーション通過後、plan_architecture.yaml が自動生成される

# ── プロジェクト情報 ──
project:
  name: ""       # プロジェクト名（必須）
  version: ""    # バージョン（必須）

# ── フィーチャー一覧（必須: 1つ以上） ──
features: {}
  # 以下のフォーマットで記載する:
  #
  # memo:                           # フィーチャー名（snake_case、必須）
  #   permission: user              # admin / user / shared / direct（必須）
  #   description: "メモ機能"        # 説明（必須）
  #   entities:                     # エンティティ一覧（必須: 1つ以上）
  #     - memo                      #   → memo_entity.dart
  #   usecases:                     # ユースケース一覧（オプション）
  #     - get_memo                  #   → get_memo_usecase.dart
  #     - create_memo
  #   data_sources:                 # データソース設定（オプション）
  #     local: true                 #   1_local/ を生成するか（デフォルト: true）
  #     remote: false               #   2_remote/ を生成するか（デフォルト: false）
  #   pages:                        # ページ一覧（オプション）
  #     - memo_list                 #   → memo_list_page.dart
  #     - memo_detail               #   → memo_detail_page.dart
  #   widgets:                      # ウィジェット一覧（全てオプション）
  #     atoms:
  #       - memo_status_badge       #   → memo_status_badge_atom.dart
  #     molecules:
  #       - memo_card               #   → memo_card_molecule.dart
  #     organisms:
  #       - memo_list               #   → memo_list_organism.dart

# ── Core層の追加設定（オプション） ──
core:
  routing:
    files: []                       # app_router → app_router.dart
    paths: []                       # memo_paths → memo_paths.dart
  theme:
    files: []                       # app_theme → app_theme.dart
  database:
    tables: []                      # memos → memos_table.dart
