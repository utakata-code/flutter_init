# コアスタック: バージョン構成
#
# このファイルを編集して add_dependencies.sh で pubspec.yaml に追加する
# 依存関係を定義します。
#
# ワークフロー:
#   1. このファイルを編集（パッケージの追加・削除・バージョン変更）
#   2. AI/scripts/setup/add_dependencies.sh を実行
#   3. pubspec.yaml に依存関係が追加されます
#
# 書式:
#   package_name: ^version    → 通常の依存関係
#   # package_name: ^version  → コメントアウト（スキップされます）

dependencies:
  # 状態管理
  hooks_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.0
  flutter_hooks: ^0.20.0

  # データモデル
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 画面遷移
  go_router: ^15.1.3

  # ローカルDB
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1

  # ユーティリティ
  logger: ^2.6.2

dev_dependencies:
  # コード生成
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ">=2.25.0 <2.28.2"
  riverpod_generator: ^2.6.5

  # 品質管理
  flutter_lints: ^5.0.0
