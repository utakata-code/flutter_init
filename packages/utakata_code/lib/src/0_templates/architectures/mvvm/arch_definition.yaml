# アーキテクチャ定義: MVVM (3-layer)
#
# Model-View-ViewModel パターン。
# Flutter の状態管理を ViewModel 層に集約するシンプルなアーキテクチャ。
# Clean Architecture より層が少なく、小〜中規模プロジェクト向け。

id: mvvm
displayName: "MVVM (3-layer)"
guides_path: "principles"

# コアモジュール
core_modules:
  - id: routing
    path: "lib/core/routing"
    displayName: "routing/"
  - id: theme
    path: "lib/core/theme"
    displayName: "theme/"
  - id: di
    path: "lib/core/di"
    displayName: "di/"
  - id: api
    path: "lib/core/api"
    displayName: "api/"

# 推奨依存関係
dependencies:
  flutter:
    sdk: flutter
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  dio: ^5.4.0

dev_dependencies:
  build_runner: ^2.4.8
  freezed: ^3.0.0
  json_serializable: ^6.8.0

# ─── レイヤー定義 ───
# MVVM は 3層:
#   1_model     : データモデル、リポジトリインターフェース、サービス
#   2_viewmodel : 状態管理、ビジネスロジック
#   3_view      : UI（Screen / Widget）
layers:
  - name: 1_model
    dirs:
      - 1_entities
      - 2_repositories
      - 3_services
      - exceptions

  - name: 2_viewmodel
    dirs:
      - 1_states
      - 2_notifiers

  - name: 3_view
    dirs:
      - 1_widgets
      - 2_screens

# ─── 命名規則 ───
naming_rules:
  - dir_pattern: "1_model/1_entities"
    file_pattern: "^.+_entity\\.dart$"
    description: "{name}_entity.dart"

  - dir_pattern: "1_model/2_repositories"
    file_pattern: "^.+_repository\\.dart$"
    description: "{name}_repository.dart"

  - dir_pattern: "1_model/3_services"
    file_pattern: "^.+_service\\.dart$"
    description: "{name}_service.dart"

  - dir_pattern: "1_model/exceptions"
    file_pattern: "^.+_exception\\.dart$"
    description: "{name}_exception.dart"

  - dir_pattern: "2_viewmodel/1_states"
    file_pattern: "^.+_state\\.dart$"
    description: "{feature}_state.dart"

  - dir_pattern: "2_viewmodel/2_notifiers"
    file_pattern: "^.+_notifier\\.dart$"
    description: "{feature}_notifier.dart"

  - dir_pattern: "3_view/1_widgets"
    file_pattern: "^.+_widget\\.dart$"
    description: "{name}_widget.dart"

  - dir_pattern: "3_view/2_screens"
    file_pattern: "^.+_screen\\.dart$"
    description: "{feature}_screen.dart"

# ─── ガイド定義 ───
guides:
  - title: "Entity Layer — エンティティ層"
    layer_path: "1_model/1_entities"
    apply_to: "lib/features/**/1_model/1_entities/**"
    naming_pattern: "{対象名}_entity.dart"
    detail_content_path: "architectures/mvvm/layers/features/1_model/1_entities/GUIDE.md"
    do_list:
      - "ビジネスオブジェクトの定義: アプリケーションで扱う中核的なデータ構造"
      - "不変性の保証: freezed を使用してイミュータブルに定義"
      - "純粋なDartコード: 外部ライブラリに依存しない実装"
    dont_list:
      - "UIフレームワークへの依存: Flutterウィジェットのimport禁止"
      - "データベースアクセス: 永続化に関する処理の記述"
      - "状態管理ライブラリへの依存: Riverpodなどのimport禁止"
    allowed_imports:
      - "import 'dart:core';"
      - "import 'package:freezed_annotation/freezed_annotation.dart';"
      - "import 'package:json_annotation/json_annotation.dart';"
      - "import '../other_entity.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:riverpod/riverpod.dart';"
      - "import 'package:dio/dio.dart';"

  - title: "Repository Layer — リポジトリ層"
    layer_path: "1_model/2_repositories"
    apply_to: "lib/features/**/1_model/2_repositories/**"
    naming_pattern: "{対象名}_repository.dart"
    detail_content_path: "architectures/mvvm/layers/features/1_model/2_repositories/GUIDE.md"
    do_list:
      - "データアクセスの抽象化: abstract interface class で定義"
      - "ドメイン境界の保護: 外部データソース仕様をドメインモデルから隠蔽"
      - "実装クラスは同ディレクトリに配置: {name}_repository_impl.dart"
    dont_list:
      - "データベース・通信ライブラリへの依存: dioやdriftの直接import"
      - "状態管理ライブラリへの依存: Riverpodの直接import"
    allowed_imports:
      - "import '../1_entities/some_entity.dart';"
      - "import '../exceptions/some_exception.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:dio/dio.dart';"
      - "import 'package:drift/drift.dart';"

  - title: "Service Layer — サービス層"
    layer_path: "1_model/3_services"
    apply_to: "lib/features/**/1_model/3_services/**"
    naming_pattern: "{対象名}_service.dart"
    detail_content_path: "architectures/mvvm/layers/features/1_model/3_services/GUIDE.md"
    do_list:
      - "ビジネスロジックの集約: 複数リポジトリの協調や業務処理を実装"
      - "リポジトリインターフェースへの依存: 実装クラスではなく抽象に依存"
    dont_list:
      - "UIロジックの混入: BuildContext等への依存禁止"
      - "状態管理ライブラリへの依存: Riverpodのimport禁止"
    allowed_imports:
      - "import '../1_entities/some_entity.dart';"
      - "import '../2_repositories/some_repository.dart';"
      - "import '../exceptions/some_exception.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:riverpod/riverpod.dart';"

  - title: "Model Exceptions Layer — 例外層"
    layer_path: "1_model/exceptions"
    apply_to: "lib/features/**/1_model/exceptions/**"
    naming_pattern: "{対象名}_exception.dart"
    detail_content_path: "architectures/mvvm/layers/features/1_model/exceptions/GUIDE.md"
    do_list:
      - "ドメイン固有エラーの定義: ビジネスロジック上の異常系を型安全に表現"
    dont_list:
      - "インフラ層エラーの漏洩: HTTPエラーやSQLエラーをそのままスローしない"
    allowed_imports:
      - "import 'dart:core';"
    forbidden_imports:
      - "import 'package:dio/dio.dart';"

  - title: "ViewModel State Layer — 状態定義層"
    layer_path: "2_viewmodel/1_states"
    apply_to: "lib/features/**/2_viewmodel/1_states/**"
    naming_pattern: "{feature名}_state.dart"
    detail_content_path: "architectures/mvvm/layers/features/2_viewmodel/1_states/GUIDE.md"
    do_list:
      - "UI状態の定義: ローディング、成功、失敗など不変状態オブジェクト"
      - "freezed で不変性を保証"
    dont_list:
      - "ミュータブルな状態表現: 必ず @freezed でイミュータブルに定義"
      - "Flutter UIへの依存: BuildContext等のimport禁止"
    allowed_imports:
      - "import 'package:freezed_annotation/freezed_annotation.dart';"
      - "import '../../1_model/1_entities/some_entity.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:riverpod/riverpod.dart';"

  - title: "ViewModel Notifier Layer — ノティファイア層"
    layer_path: "2_viewmodel/2_notifiers"
    apply_to: "lib/features/**/2_viewmodel/2_notifiers/**"
    naming_pattern: "{feature名}_notifier.dart"
    detail_content_path: "architectures/mvvm/layers/features/2_viewmodel/2_notifiers/GUIDE.md"
    do_list:
      - "UI状態変更ロジック: ユーザーイベントを受けてServiceを呼び出しStateを更新"
      - "Riverpod Notifier で状態遷移を実装"
    dont_list:
      - "ビジネスルールの直接記述: ロジックはServiceに委譲"
      - "Flutter UIへの依存: BuildContext等のimport禁止"
    allowed_imports:
      - "import 'package:riverpod_annotation/riverpod_annotation.dart';"
      - "import '../1_states/some_state.dart';"
      - "import '../../1_model/3_services/some_service.dart';"
    forbidden_imports:
      - "import 'package:flutter/material.dart';"

  - title: "View Widget Layer — ウィジェット層"
    layer_path: "3_view/1_widgets"
    apply_to: "lib/features/**/3_view/1_widgets/**"
    naming_pattern: "{対象名}_widget.dart"
    detail_content_path: "architectures/mvvm/layers/features/3_view/1_widgets/GUIDE.md"
    do_list:
      - "再利用可能なUI部品の定義: カード、リスト項目、フォーム等"
      - "引数でデータを受け取る: コンストラクタ経由でのデータ受け渡し"
    dont_list:
      - "Riverpodへの直接依存: 状態管理からの隔離"
      - "ビジネスロジックの混入: 表示のみに専念"
    allowed_imports:
      - "import 'package:flutter/material.dart';"
      - "import '../../1_model/1_entities/some_entity.dart';"
    forbidden_imports:
      - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
      - "import '../../2_viewmodel/2_notifiers/some_notifier.dart';"

  - title: "View Screen Layer — 画面層"
    layer_path: "3_view/2_screens"
    apply_to: "lib/features/**/3_view/2_screens/**"
    naming_pattern: "{feature名}_screen.dart"
    detail_content_path: "architectures/mvvm/layers/features/3_view/2_screens/GUIDE.md"
    do_list:
      - "完全な画面レイアウトの構築: Widgetを配置して1つの画面を定義"
      - "状態の監視: ConsumerWidget / HookConsumerWidget でNotifierの状態をwatch"
    dont_list:
      - "ビジネスロジック記述: イベントをNotifierに通知するのみ"
      - "Repository / Serviceの直接呼び出し: 必ずNotifier経由"
    allowed_imports:
      - "import 'package:flutter/material.dart';"
      - "import 'package:hooks_riverpod/hooks_riverpod.dart';"
      - "import '../../2_viewmodel/2_notifiers/some_notifier.dart';"
      - "import '../1_widgets/some_widget.dart';"
    forbidden_imports:
      - "import '../../1_model/2_repositories/some_repository.dart';"
      - "import '../../1_model/3_services/some_service.dart';"

# ─── import 監査規則 (`utakata imports` が使用) ───
# 書式は clean_architecture の import_rules と同じ。
#   internal: 各層が import してよい層(ホワイトリスト。自層は常に許可)
#   external: 層ごとに禁止するパッケージ(ブラックリスト。glob 可)
#   exclude : 監査から除外するファイル(コード生成物)
import_rules:
  exclude:
    - "**.g.dart"
    - "**.freezed.dart"

  internal:
    - dir_pattern: "1_model/1_entities"
      allow: ["1_model/exceptions"]
    - dir_pattern: "1_model/2_repositories"
      allow: ["1_model/1_entities", "1_model/exceptions"]
    - dir_pattern: "1_model/3_services"
      allow: ["1_model/1_entities", "1_model/2_repositories", "1_model/exceptions"]
    - dir_pattern: "1_model/exceptions"
      allow: []
    - dir_pattern: "2_viewmodel/1_states"
      allow: ["1_model/1_entities"]
    - dir_pattern: "2_viewmodel/2_notifiers"
      allow: ["1_model", "2_viewmodel/1_states"]
    - dir_pattern: "3_view/1_widgets"
      allow: ["1_model/1_entities"]
    - dir_pattern: "3_view/2_screens"
      allow: ["1_model/1_entities", "2_viewmodel", "3_view/1_widgets"]

  external:
    # Model 層は UI・状態管理に依存しない(dio 等の IO はサービスが担うため許可)
    - dir_pattern: "1_model"
      deny: ["flutter", "flutter_hooks", "*riverpod*", "go_router"]
    # エンティティは純粋 Dart(IO ライブラリも持ち込まない)
    - dir_pattern: "1_model/1_entities"
      deny: ["dio", "http", "drift", "sqflite", "shared_preferences"]
    # ViewModel 層は UI(ウィジェット)に依存しない
    - dir_pattern: "2_viewmodel"
      deny: ["flutter", "go_router"]
    # 状態クラスは純粋な freezed オブジェクト
    - dir_pattern: "2_viewmodel/1_states"
      deny: ["*riverpod*", "flutter_hooks"]
    # View 層は IO を直接行わない
    - dir_pattern: "3_view"
      deny: ["dio", "http", "drift", "sqflite"]
